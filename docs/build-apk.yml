name: بناء APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: بناء تطبيق M❤️M (APK)
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Capacitor
        run: |
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

      - name: إضافة منصة أندرويد
        run: npx cap add android

      - name: نسخ ملفات التطبيق داخل المشروع الأندرويد
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r index.html css js photos icon audio manifest.webmanifest capacitor.config.json android/app/src/main/assets/public/

      - name: استبدال أيقونات التطبيق بأيقونة M❤️M
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          cp -r resources/android/mipmap-*/ android/app/src/main/res/

      - name: بناء APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: رفع ملف APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: M-M-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: إنشاء إصدار GitHub Release (عند دفع وسم v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: M❤️M v${{ github.ref_name }}
          body: |
            📱 تطبيق M❤️M — ذكرياتنا
            APK جاهز للتثبيت على أندرويد.
